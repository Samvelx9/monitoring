filter {
  if [type] == "nginx-error" {
    grok {
      patterns_dir => ["/opt/logstash/patterns/nginxlogs/"]
      break_on_match => false
      match => { "message" => "%{NGINXERROR}" }
    }
    mutate {
      convert => { "host" => "string" }
      remove_field => [ "host" ]
    }
    if [nginx.service.name] == "shell" {
        mutate {copy => { "nginx.service.version" => "nginx.app.name"}}
        mutate {replace => {"nginx.service.version" => "-" }}
    }
  }

  else if [type] == "nginx-access" {
    grok {
      patterns_dir => ["/opt/logstash/patterns/nginxlogs/"]
      break_on_match => false
      match => { "message" => "%{NGINXACCESS}" }
      match => { "request_uri" => "%{NGINXURISOURCE}" }
    }
    date {
        timezone => "UTC"
        match => ["nginxlog_timestamp", "dd/MMM/yyyy:HH:mm:ss.SSS"]
        remove_field => ["nginxlog_timestamp"]
    }
    mutate {
       convert => { "bytes_sent" => "integer" }
       convert => { "body_bytes_sent" => "integer" }
       convert => { "request_time" => "float" }
       convert => { "upstream_response_time" => "float" }
       remove_field => [ "image_id", "image_name", "host", "command", "container_id", "container_name", "tag", "level", "message" ]
       remove_tag => [ "_grokparsefailure_sysloginput" ]
       gsub => [
         "httpversion", "-", "",
         "upstream_response_time", "-", "",
         "http_referrer", "-", "",
         "source_service_name", "-", "",
         "source_service_name", "authjwtservice", "authservicejwt",
         "source_service_name", "dataclassificationtransferservice", "classificationservice",
         "source_service_name", "formservice", "formmanagementservice",
         "source_service_name", "migrationservice", "migrationdesigner",
         "source_service_name", "oauthservice", "authservice",
         "source_service_name", "reportstructurerecommendationservice", "recommendationservice",
         "source_service_name", "systemintegrityservice", "idmsystemintegrityservice",
         "source_service_name", "umauthorizationservice", "authorizationservice",
         "source_service_name", "umorganizationservice", "orgchartservice",
         "source_service_name", "umpermissionservice", "permissionservice",
         "source_service_name", "umroleservice", "roleservice",
         "source_service_name", "validationcalculationmetadataservice", "vcmetadataservice",
         "source_service_name", "validationcalculationservice", "validationservice",
         "source_service_name", "workflowservice", "wfservice",
         "nginx.traceid", "-", "",
         "nginx.spanid", "-", "",
         "nginx.parentspanid", "-", "",
         "http.ssid", "-", "",
         "nginx.request_id", "-", "",
         "cookie.suid", "-", ""
       ]
    }
    if [nginx.service.name] == "shell" {
        mutate {copy => { "nginx.service.version" => "nginx.app.name"}}
        mutate {replace => {"nginx.service.version" => "-" }}
    }
  }

  else if [type] == "log" {
    grok {
      patterns_dir => ["/opt/monitoring/logging/patterns/"]
      break_on_match => false
      match => {"message" => "%{APPLOG}"}
      match => {"[log][file][path]" => "%{APPBEATSSOURCE}"}
    }
    date {
        timezone => "Asia/Yerevan"
        match => ["app.logtime", "yyyy-MM-dd HH:mm:ss,SSS"]
        remove_field => ["app.logtime"]
    }
    mutate {
      convert => { "host" => "string" }
      gsub => [
        "app.traceid", "[${]+ctx:X-B3-TraceId.+", "no-trace",
        "app.spanid", "[${]+ctx:X-B3-SpanId.+", "no-span",
        "app.name", "/metrics", "metrics-endpoint",
        "app.name", "[${]+ctx:applicationId.+", "no-application",
        "app.service.name", "-", ""
      ]
      remove_field => [ "[beat][hostname]", "[beat][name]", "host" , "[beat][version]", "ignore.newlines" ]
    }
  }
}
