apiVersion: 1
groups:
    - orgId: 1
      name: 10s
      folder: alerting
      interval: 10s
      rules:
        - uid: microservice-availability
          title: Microservice availability
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: "000000001"
              model:
                datasource:
                    type: prometheus
                    uid: "000000001"
                editorMode: code
                expr: sum by (cluster,namespace,pod)(kube_pod_status_ready{condition="true",namespace!~"chatwoot|cert-manager|argocd|velero|cnpg-system|consul.*|metallb-system|vault|kube-system|monitoring|knative-serving|ingress-nginx|istio-system|minio|default|filebeat|hal|openunison|opentelemetry|randomcoffee|projecttracker|kubernetes-dashboard|kube-fledged|portal-qa"} == 0 and on(pod) kube_pod_status_phase{phase!="Succeeded"} == 1)
                instant: false
                interval: ""
                intervalMs: 30000
                legendFormat: '{{cluster}} {{namespace}} {{pod}}'
                maxDataPoints: 43200
                range: true
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: vldByyKnz
          panelId: 2
          noDataState: OK
          execErrState: OK
          for: 3m
          annotations:
            __dashboardUid__: vldByyKnz
            __panelId__: "2"
            summary: '{{ index $labels "cluster" }} {{ index $labels "namespace" }} {{ index $labels "pod" }} pod is not ready'
          labels:
            severity: warning
          isPaused: false
