apiVersion: 1
groups:
    - orgId: 1
      name: 10s
      folder: alerting
      interval: 10s
      rules:
        - uid: application-log-count
          title: Application log count
          condition: A
          data:
            - refId: A
              relativeTimeRange:
                from: 1800
                to: 0
              datasourceUid: "000000006"
              model:
                alias: Application log count
                bucketAggs:
                    - $$hashKey: object:286
                      field: '@timestamp'
                      id: "2"
                      settings:
                        interval: auto
                        min_doc_count: 0
                        trimEdges: 0
                      type: date_histogram
                datasource:
                    type: elasticsearch
                    uid: "000000006"
                intervalMs: 1000
                maxDataPoints: 43200
                metrics:
                    - field: '@timestamp'
                      id: "1"
                      type: cardinality
                query: 'type: "log"'
                refId: A
                timeField: '@timestamp'
            - refId: B
              relativeTimeRange:
                from: 1800
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: count
                refId: B
                type: reduce
            - refId: C
              relativeTimeRange:
                from: 1800
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: vldByyKnz
          panelId: 49
          noDataState: Alerting
          execErrState: OK
          for: 30m
          annotations:
            __dashboardUid__: vldByyKnz
            __panelId__: "49"
            summary: There are no Application logs in kibana for more than 1h
          labels:
            severity: warning
          isPaused: false
