apiVersion: 1
groups:
    - orgId: 1
      name: 10s
      folder: alerting
      interval: 10s
      rules:
        - uid: ram-usage
          title: RAM usage
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: "000000001"
              model:
                datasource:
                    type: prometheus
                    uid: "000000001"
                exemplar: true
                expr: ((node_memory_MemTotal_bytes{job!="Jenkins", instance!~"sis2s041:9100"} - node_memory_MemFree_bytes{job!="Jenkins"} - (node_memory_Cached_bytes{job!="Jenkins"} + node_memory_Buffers_bytes{job!="Jenkins"} + node_memory_SReclaimable_bytes{job!="Jenkins"})) / node_memory_MemTotal_bytes{job!="Jenkins"} )*100
                interval: ""
                intervalMs: 30000
                legendFormat: '{{kubernetes_node}} {{instance}}'
                maxDataPoints: 43200
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params: []
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - B
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                reducer: last
                refId: B
                type: reduce
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 95
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: B
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          dashboardUid: vldByyKnz
          panelId: 48
          noDataState: OK
          execErrState: OK
          for: 3m
          annotations:
            __dashboardUid__: vldByyKnz
            __panelId__: "48"
            summary: '{{ index $labels "kubernetes_node" }}{{ index $labels "instance" }} is {{ humanize (index $values "B").Value }}%'
          labels:
            severity: critical
          isPaused: false
