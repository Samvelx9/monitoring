apiVersion: 1
policies:
    - orgId: 1
      receiver: projectemail
      routes:
        - receiver: critical
          object_matchers:
            - - severity
              - =
              - critical
          routes:
            - receiver: projectemail
              group_by:
                - alertname
              object_matchers:
                - - severity
                  - =
                  - critical
              continue: true
              group_wait: 1d
              group_interval: 1d
              repeat_interval: 1d
            - receiver: critical
              group_by:
                - alertname
              object_matchers:
                - - severity
                  - =
                  - critical
              continue: true
        - receiver: warning
          object_matchers:
            - - severity
              - =
              - warning
          routes:
            - receiver: projectemail
              group_by:
                - alertname
              object_matchers:
                - - severity
                  - =
                  - warning
              continue: true
              group_wait: 1d
              group_interval: 1d
              repeat_interval: 1d
            - receiver: warning
              group_by:
                - alertname
              object_matchers:
                - - severity
                  - =
                  - warning
              group_wait: 1m
              group_interval: 5m
              repeat_interval: 1h
              continue: true
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 15m

